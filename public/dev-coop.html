<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pré-visualização do coop</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  .dev-bar{position:relative;z-index:3;margin-top:6px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
  .dev-bar .btn{min-height:40px;padding:6px 12px;font-size:.9rem}
  .dev-info{background:#fff;border-radius:14px;padding:6px 12px;font-weight:600;text-align:center;width:100%}
  .dev-log{font-size:.8rem;width:100%;max-height:7em;overflow:auto;background:rgba(255,255,255,.75);border-radius:12px;padding:6px 10px}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><i class="sun"></i><i class="hills"></i><i class="cloud c1"></i><i class="cloud c2"></i></div>
<main id="app">
  <section class="screen" style="max-width:640px">
    <p class="dev-info" id="info">Pré-visualização do modo coop (em construção)</p>
    <div id="board" class="board-wrap"></div>
    <div class="dev-bar">
      <button class="btn" id="b-seed">Nova semente</button>
      <button class="btn" id="b-prev">Fase −</button>
      <button class="btn" id="b-next">Fase +</button>
      <button class="btn green" id="b-round">Rodada (esperar)</button>
      <button class="btn blue" id="b-attack">Rodada (atacar)</button>
    </div>
    <div class="dev-log" id="log"></div>
  </section>
</main>
<script type="module" src="/js/dev-coop.js"></script>
</body>
</html>
